'use strict';
const $=s=>document.querySelector(s),cv=$('#canvas'),c=cv.getContext('2d'),ov=$('#overlay'),o=ov.getContext('2d'),stage=$('#stage'),panel=$('#controls'),list=$('#layers');
const S={w:1920,h:1080,bg:'#050608',bg2:'#16102b',bgMode:'solid',bgAngle:25,sel:null,layers:[],drag:null,adding:false,anchor:null};
let id=1,timer,frame=0;const closedGroups=new Set();
const types={wave:'Ленточная волна',grid:'Перспективная сетка',image:'Контур изображения',spot:'Градиентное пятно'},blends=['source-over','screen','lighter','overlay','soft-light'],styles=['solid','dash','dot'],palette=['#ffffff','#b8bec8','#35d7ff','#7cffb2','#a9ff68','#ffd166','#ff6577','#ff4fb8','#9b6cff'];
const pick=()=>S.layers.find(x=>x.id===S.sel),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgb=h=>{let x=h.slice(1);return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]};
const mix=(a,b,t)=>{let A=rgb(a),B=rgb(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t))+')'};
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1600)}
function base(o){return Object.assign({visible:true,opacity:.7,blend:'screen',x:.5,y:.5,scale:1,rotation:0,style:'solid',paint:'solid',color2:'#ffffff',gradientAngle:0,glow:0,glowColor:'#ffffff',patternDensity:1,fillMode:'none',fillColor:'#ffffff',fillColor2:'#ffffff',fillOpacity:.35,scaleX:1,scaleY:1,svgPadding:.14},o)}
function Wave(o={}){return base(Object.assign({id:id++,type:'wave',name:'Волна',color:'#ffffff',rotation:-9,lines:48,amplitude:.16,frequency:1.2,twist:.85,spread:.4,width:1.15,phase:Math.random()*6.28,anchors:[],anchorRadius:.1},o))}
function Grid(o={}){return base(Object.assign({id:id++,type:'grid',name:'Сетка',color:'#ffffff',color2:'#ffffff',paint:'gradient',opacity:.34,y:.69,rotation:-5,lines:22,bend:.2,perspective:.72,width:1},o))}
function Spot(o={}){return base(Object.assign({id:id++,type:'spot',name:'Пятно',color:'#ffffff',color2:'#ffffff',opacity:.65,blend:'screen',radius:.28,softness:.72,stretch:1.25},o))}
function add(l){S.layers.push(l);S.sel=l.id;S.anchor=null;S.adding=false;sync()}
function size(){let r=S.w/S.h,mw=$('#work').clientWidth-56,mh=$('#work').clientHeight-56,w=mw,h=w/r;if(h>mh){h=mh;w=h*r}stage.style.width=Math.max(240,w)+'px';stage.style.height=Math.max(135,h)+'px';draw()}
function transform(ctx,l){ctx.translate(l.x*S.w,l.y*S.h);ctx.rotate(l.rotation*Math.PI/180);ctx.scale(l.scale*(l.scaleX||1),l.scale*(l.scaleY||1))}
function stroke(ctx,l){let d=clamp(l.patternDensity||1,.25,4),z=S.w/1920;ctx.lineCap=l.style==='dot'?'round':'butt';ctx.setLineDash(l.style==='dash'?[14*z/d,9*z/d]:l.style==='dot'?[.1,8*z/d]:[]);ctx.shadowBlur=0}
function paint(ctx,l,w,h){if(l.paint!=='gradient')return l.color;let a=l.gradientAngle*Math.PI/180,dx=Math.cos(a)*w/2,dy=Math.sin(a)*(h||S.h)/2,g=ctx.createLinearGradient(-dx,-dy,dx,dy);g.addColorStop(0,l.color);g.addColorStop(1,l.color2);return g}
function alpha(hex,a){let q=rgb(hex);return'rgba('+q[0]+','+q[1]+','+q[2]+','+a+')'}
function waveBase(l,u,k=0){let a=l.amplitude*S.h;return k*l.spread*S.h+Math.sin(u*Math.PI*2*l.frequency+l.phase+k*l.twist*8)*a*Math.sin(Math.PI*u)+Math.sin(u*Math.PI*4+l.phase*.45)*a*.18+Math.sin(u*Math.PI*2+l.phase+k*3)*k*l.twist*S.h*.17}
function anchorPull(l,u){return l.anchors.reduce((sum,a)=>{let d=(u-a.u)/l.anchorRadius;return sum+a.dy*S.h*Math.exp(-d*d*2.2)},0)}
function wavePass(l,glow){c.save();transform(c,l);c.globalAlpha=l.opacity*(glow?.72:1);c.globalCompositeOperation=glow?'lighter':l.blend;c.filter=glow?'blur('+Math.max(2,l.glow*S.w/1920)+'px)':'none';c.strokeStyle=glow?l.glowColor:paint(c,l,S.w*1.35,S.h);c.lineWidth=l.width*S.w/1920*(glow?2.2:1);stroke(c,l);let steps=Math.max(72,Math.min(180,Math.round(180*96/Math.max(96,l.lines))));for(let n=0;n<l.lines;n++){let k=n/(l.lines-1)-.5;c.beginPath();for(let i=0;i<=steps;i++){let u=i/steps,x=(u-.5)*S.w*1.35,y=waveBase(l,u,k)+anchorPull(l,u);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}c.restore()}
function drawWave(l){if(l.glow>0)wavePass(l,true);wavePass(l,false)}
function gridPass(l,glow){c.save();transform(c,l);c.globalAlpha=l.opacity*(glow?.68:1);c.globalCompositeOperation=glow?'lighter':l.blend;c.filter=glow?'blur('+Math.max(2,l.glow*S.w/1920)+'px)':'none';c.lineWidth=l.width*S.w/1920*(glow?2.1:1);stroke(c,l);let W=S.w*1.18,H=S.h*.92,R=l.lines,C=Math.round(R*1.55);for(let r=0;r<=R;r++){let t=r/R;c.strokeStyle=glow?l.glowColor:(l.paint==='gradient'?mix(l.color,l.color2,t):l.color);c.beginPath();for(let i=0;i<=110;i++){let u=i/110,d=Math.pow(t,1+l.perspective*2),x=(u-.5)*W*(1+(1-d)*l.perspective*1.6),y=(d-.5)*H+Math.sin(u*Math.PI*2+t*4)*l.bend*S.h*(1-t*.55);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}for(let q=0;q<=C;q++){let u=q/C;c.strokeStyle=glow?l.glowColor:(l.paint==='gradient'?mix(l.color,l.color2,u):l.color);c.beginPath();for(let i=0;i<=70;i++){let t=i/70,d=Math.pow(t,1+l.perspective*2),x=(u-.5)*W*(1+(1-d)*l.perspective*1.6),y=(d-.5)*H+Math.sin(u*Math.PI*2+t*4)*l.bend*S.h*(1-t*.55);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}c.restore()}
function drawGrid(l){if(l.glow>0)gridPass(l,true);gridPass(l,false)}
function drawSpot(l){c.save();transform(c,l);c.globalAlpha=l.opacity;c.globalCompositeOperation=l.blend;let r=l.radius*S.w,inner=r*(1-l.softness),g=c.createRadialGradient(0,0,inner,0,0,r);g.addColorStop(0,alpha(l.color,1));g.addColorStop(.52,alpha(l.color2,.62));g.addColorStop(1,alpha(l.color2,0));c.scale(l.stretch,1);c.fillStyle=g;c.fillRect(-r,-r,r*2,r*2);c.restore()}
function glowMask(l,img,r){let key=img.src+'|'+l.glowColor;if(l.glowMask&&l.glowKey===key)return l.glowMask;let q=document.createElement('canvas'),w=Math.min(900,Math.max(96,img.naturalWidth||900));q.width=w;q.height=Math.max(1,Math.round(w/r));let x=q.getContext('2d');x.drawImage(img,0,0,q.width,q.height);x.globalCompositeOperation='source-in';x.fillStyle=l.glowColor;x.fillRect(0,0,q.width,q.height);l.glowMask=q;l.glowKey=key;return q}
function drawImage(l){let img=l.isVector?l.vectorImage:l.processed;if(!img)return;c.save();transform(c,l);let r=l.aspect||(img.width/img.height)||1,w=S.w*(l.isVector?.44:.32),h=w/r;if(l.glow>0){c.globalAlpha=l.opacity*.78;c.globalCompositeOperation='lighter';c.filter='blur('+Math.max(2,l.glow*S.w/1920)+'px)';c.drawImage(glowMask(l,img,r),-w/2,-h/2,w,h)}c.filter='none';c.globalAlpha=l.opacity;c.globalCompositeOperation=l.blend;c.drawImage(img,-w/2,-h/2,w,h);c.restore()}
function localToWorld(l,x,y){let cs=Math.cos(l.rotation*Math.PI/180),sn=Math.sin(l.rotation*Math.PI/180);x*=l.scale*(l.scaleX||1);y*=l.scale*(l.scaleY||1);return{x:l.x*S.w+x*cs-y*sn,y:l.y*S.h+x*sn+y*cs}}
function worldToLocal(l,x,y){x-=l.x*S.w;y-=l.y*S.h;let cs=Math.cos(-l.rotation*Math.PI/180),sn=Math.sin(-l.rotation*Math.PI/180),rx=x*cs-y*sn,ry=x*sn+y*cs;return{x:rx/(l.scale*(l.scaleX||1)),y:ry/(l.scale*(l.scaleY||1))}}

function handles(){o.clearRect(0,0,S.w,S.h);let l=pick();if(!l||l.type!=='wave')return;o.save();o.lineWidth=2*S.w/1920;o.strokeStyle='#a9ff68';o.fillStyle='#101217';l.anchors.forEach((a,i)=>{let p=anchorWorld(l,a),b=localToWorld(l,(a.u-.5)*S.w*1.35,waveBase(l,a.u));o.globalAlpha=.55;o.beginPath();o.moveTo(b.x,b.y);o.lineTo(p.x,p.y);o.stroke();o.globalAlpha=1;o.beginPath();o.arc(p.x,p.y,(i===S.anchor?9:7)*S.w/1920,0,Math.PI*2);o.fill();o.stroke()});o.restore();stage.classList.toggle('move',!!l)}
function render(){c.globalAlpha=1;c.globalCompositeOperation='source-over';c.shadowBlur=0;c.setLineDash([]);if(S.bgMode==='gradient'){let a=S.bgAngle*Math.PI/180,dx=Math.cos(a)*S.w/2,dy=Math.sin(a)*S.h/2,g=c.createLinearGradient(S.w/2-dx,S.h/2-dy,S.w/2+dx,S.h/2+dy);g.addColorStop(0,S.bg);g.addColorStop(1,S.bg2);c.fillStyle=g}else c.fillStyle=S.bg;c.fillRect(0,0,S.w,S.h);S.layers.forEach(l=>{if(!l.visible)return;if(l.type==='wave')drawWave(l);else if(l.type==='grid')drawGrid(l);else if(l.type==='spot')drawSpot(l);else drawImage(l)});handles()}
function draw(){if(frame)return;frame=requestAnimationFrame(()=>{frame=0;render()})}
function layerList(){list.innerHTML='';[...S.layers].reverse().forEach(l=>{let e=document.createElement('div');e.className='layer'+(l.id===S.sel?' on':'');e.innerHTML='<div class="ico">'+(l.type==='wave'?'~':l.type==='grid'?'#':l.type==='spot'?'*':'@')+'</div><div><div class="name">'+l.name+'</div><div class="type">'+types[l.type]+'</div></div><button class="eye">'+(l.visible?'o':'-')+'</button>';e.onclick=x=>{if(x.target.closest('.eye'))l.visible=!l.visible;else{S.sel=l.id;S.anchor=null;S.adding=false}sync()};list.appendChild(e)})}
function row(n,k,min,max,step,f){let l=pick();f=f||function(v){return v};return'<div class="row"><div class="label"><span>'+n+'</span><span class="val" data-val="'+k+'">'+f(l[k])+'</span></div><input type="range" data-key="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+l[k]+'"></div>'}

function color(n,k){let v=pick()[k];return'<div class="row"><div class="label">'+n+'</div><div class="colorpick"><input type="color" data-key="'+k+'" value="'+v+'">'+swatches(k,v)+'</div></div>'}
function colorState(n,k){let v=S[k];return'<div class="row"><div class="label">'+n+'</div><div class="colorpick"><input type="color" data-state="'+k+'" value="'+v+'">'+swatches(k,v,true)+'</div></div>'}
